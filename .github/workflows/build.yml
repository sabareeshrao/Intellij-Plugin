name: Build IntelliJ Plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: intellij-plugin-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test plugin
        run: ./gradlew build --stacktrace

      - name: Build installable plugin ZIP
        run: ./gradlew buildPlugin --stacktrace

      - name: Upload installable plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroTopo-Lesson-Runner-${{ env.PLUGIN_VERSION }}
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Build custom plugin repository
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/plugins
          PLUGIN_FILE="$(basename "$(find build/distributions -maxdepth 1 -name '*.zip' -print -quit)")"
          cp "build/distributions/$PLUGIN_FILE" "site/plugins/$PLUGIN_FILE"

          cat > site/updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin
                id="com.sabareeshrao.intellijlesson"
                url="https://raw.githubusercontent.com/sabareeshrao/Intellij-Plugin/plugin-repository/plugins/$PLUGIN_FILE"
                version="$PLUGIN_VERSION">
              <idea-version since-build="252"/>
              <name>AeroTopo Lesson Runner</name>
              <description><![CDATA[Runs the AeroTopo lesson curriculum directly inside real IntelliJ IDEA.]]></description>
              <change-notes><![CDATA[Development build $PLUGIN_VERSION from commit ${GITHUB_SHA::7}.]]></change-notes>
            </plugin>
          </plugins>
          EOF

          cat > site/README.md <<EOF
          # AeroTopo Lesson Runner Plugin Repository

          Current development version: **$PLUGIN_VERSION**

          IntelliJ custom repository URL:

          \`\`\`text
          https://raw.githubusercontent.com/sabareeshrao/Intellij-Plugin/plugin-repository/updatePlugins.xml
          \`\`\`
          EOF

      - name: Publish custom plugin repository branch
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUBLISH_DIR="$(mktemp -d)"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PUBLISH_DIR"
          cd "$PUBLISH_DIR"

          if git ls-remote --exit-code --heads origin plugin-repository >/dev/null 2>&1; then
            git fetch --quiet origin plugin-repository
            git checkout --quiet -B plugin-repository origin/plugin-repository
          else
            git checkout --quiet --orphan plugin-repository
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/site/." .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish plugin $PLUGIN_VERSION"
          git push --quiet origin plugin-repository
