name: Build IntelliJ Plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: intellij-plugin-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test plugin
        run: ./gradlew build --stacktrace
      - name: Build installable plugin ZIP
        run: ./gradlew buildPlugin --stacktrace
      - name: Upload installable plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroTopo-Lesson-Runner-${{ env.PLUGIN_VERSION }}
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Build custom plugin repository
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/plugins
          PLUGIN_FILE="$(basename "$(find build/distributions -maxdepth 1 -name '*.zip' -print -quit)")"
          cp "build/distributions/$PLUGIN_FILE" "site/plugins/$PLUGIN_FILE"

          cat > site/updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin
                id="com.sabareeshrao.intellijlesson"
                url="https://sabareeshrao.github.io/Intellij-Plugin/plugins/$PLUGIN_FILE"
                version="$PLUGIN_VERSION">
              <idea-version since-build="252"/>
              <name>AeroTopo Lesson Runner</name>
              <description><![CDATA[Runs the AeroTopo lesson curriculum directly inside real IntelliJ IDEA.]]></description>
              <change-notes><![CDATA[Development build $PLUGIN_VERSION from commit ${GITHUB_SHA::7}.]]></change-notes>
            </plugin>
          </plugins>
          EOF

          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>AeroTopo Lesson Runner Plugin Repository</title></head>
          <body>
            <h1>AeroTopo Lesson Runner</h1>
            <p>Current development version: <strong>$PLUGIN_VERSION</strong></p>
            <p>Custom repository URL:</p>
            <code>https://sabareeshrao.github.io/Intellij-Plugin/updatePlugins.xml</code>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages content
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy custom plugin repository
        id: deployment
        uses: actions/deploy-pages@v4
